<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golpe Block</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>

        <button id="btnMenu">
            ☰
        </button>

        <h1>Golpe Block</h1>

    </header>

    <!-- Pesquisa -->
    <section id="pesquisa">

        <input type="text" id="campoPesquisa" placeholder="Pesquisar publicação..." >

        <button id="btnPesquisar">
            Pesquisar
        </button>

    </section>

    <!-- Lista de Publicações -->
    <main>

        <div id="listaPublicacoes">

            <!--
            As publicações serão carregadas
            dinamicamente pelo JavaScript.
            -->

        </div>

    </main>

    <!-- Menu Lateral -->
    <aside id="menuLateral" hidden>

        <p id="emailUsuario">
            Email:
        </p>

        <button id="btnNovaPublicacao">
            Nova Publicação
        </button>

        <button id="btnLogout">
            Sair
        </button>

    </aside>

    <!-- Modal Nova Publicação -->
    <div id="modalNovaPublicacao" hidden>

        <h2>Nova Publicação</h2>

        <button id="btnFecharModal">
            X
        </button>

        <form id="formNovaPublicacao">

            <label for="tituloPublicacao">
                Título
            </label>

            <br>

            <input type="text" id="tituloPublicacao" name="tituloPublicacao" >

            <br><br>

            <label for="conteudoPublicacao">
                Conteúdo
            </label>

            <br>

            <textarea id="conteudoPublicacao" name="conteudoPublicacao" rows="8" cols="50" ></textarea>

            <br><br>

            <button type="submit" id="btnPublicar" >
                Publicar
            </button>

        </form>

    </div>

    <script src="js/main.js"></script>

</body>
</html>
