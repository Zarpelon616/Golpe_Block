<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golpe Block</title>

    <link rel="stylesheet" href="css/publicacao.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>

        <button id="btnMenu">
            ☰
        </button>

        <h1>Golpe Block</h1>

    </header>

    <!-- Publicação -->
    <main>

        <section id="publicacao">

            <h2 id="tituloPublicacao">
                Título da publicação
            </h2>

            <p id="dataPublicacao">
                Publicado em:
            </p>

            <hr>

            <div id="conteudoPublicacao">

                <!--
                O conteúdo da publicação
                será carregado pelo JavaScript.
                -->

            </div>

                <button id="btnExcluirPublicacao">
                    Excluir Publicação
                </button>

        </section>

        <hr>

        <!-- Área de Comentários -->
        <section id="comentarios">

            <h3>Comentários</h3>

            <div id="listaComentarios">

                <!--
                Os comentários serão carregados
                dinamicamente pelo JavaScript.
                -->

            </div>

        </section>

        <hr>

        <!-- Novo Comentário -->
        <section id="novoComentario">

            <h3>Adicionar Comentário</h3>

            <form id="formComentario">

                <textarea id="campoComentario" name="comentario" rows="5" cols="60" placeholder="Digite seu comentário..." ></textarea>

                <br><br>

                <button type="submit" id="btnComentar" >
                    Comentar
                </button>

            </form>

        </section>

    </main>

    <!-- Menu Lateral -->
    <aside id="menuLateral" hidden>

        <p id="emailUsuario">
            Email:
        </p>

        <button id="btnNovaPublicacao">
            Nova Publicação
        </button>

        <button id="btnLogout">
            Sair
        </button>

    </aside>

    <!-- Modal Nova Publicação -->
    <div id="modalNovaPublicacao" hidden>

        <h2>Nova Publicação</h2>

        <button id="btnFecharModal">
            X
        </button>

        <form id="formNovaPublicacao">

            <label for="tituloNovaPublicacao">
                Título
            </label>

            <br>

            <input type="text" id="tituloNovaPublicacao" name="tituloNovaPublicacao" >

            <br><br>

            <label for="conteudoNovaPublicacao">
                Conteúdo
            </label>

            <br>

            <textarea id="conteudoNovaPublicacao" name="conteudoNovaPublicacao" rows="8" cols="50" ></textarea>

            <br><br>

            <button type="submit" id="btnPublicar" >
                Publicar
            </button>

        </form>

    </div>

    <script src="js/publicacao.js"></script>

</body>
</html>
